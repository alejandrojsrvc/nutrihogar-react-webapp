<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#69c420" />
    <script>
      (() => {
        let stored = 'system';
        try {
          stored = localStorage.getItem('nutrihogar-theme') || 'system';
        } catch {
          // The system preference still provides a safe initial theme.
        }
        const dark =
          stored === 'dark' ||
          (stored !== 'light' &&
            matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#11130f' : '#69c420');
      })();
    </script>
    <meta
      name="description"
      content="NutriHogar, organización nutricional para toda la familia."
    />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>NutriHogar</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
